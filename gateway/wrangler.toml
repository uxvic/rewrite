name = "rewrite-gateway"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Secrets are set with `wrangler secret put` (see README).
[vars]
PROVIDER = "gemini"            # gemini | openrouter | groq | anthropic
GEMINI_MODEL = "gemini-2.5-flash"
PER_USER_DAILY_LIMIT = "50"    # rewrites per signed-in user per day
GLOBAL_DAILY_LIMIT = "2000"    # total rewrites across all users per day (protects your quota)
EMAIL_FROM = "Rewrite <onboarding@resend.dev>"   # replace with your verified sender
KIT_FORM_ID = ""               # optional: add subscribers to this Kit form

# Create with: wrangler kv namespace create RW_KV  (then paste the id below)
[[kv_namespaces]]
binding = "RW_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
