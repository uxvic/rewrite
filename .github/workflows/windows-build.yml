name: windows-build

# Builds the Windows app on a GitHub-hosted Windows runner. Uploads two artifacts:
# a self-contained single-file portable exe (Rewrite-win-x64) and a Velopack
# installer + update feed (Rewrite-Setup) that a real download/auto-update uses.

on:
  push:
    branches: [ "claude/kind-brahmagupta-nii3ih" ]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/Rewrite.sln

      - name: Build (Release)
        run: dotnet build windows/Rewrite.sln -c Release --no-restore

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish windows/src/Rewrite/Rewrite.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Rewrite-win-x64
          path: publish

      # --- Velopack installer + update feed -------------------------------
      # Velopack packages a loose (non-single-file) folder publish; it replaces
      # files in place on update, so we publish separately for it.
      - name: Publish for Velopack (folder, self-contained)
        run: >
          dotnet publish windows/src/Rewrite/Rewrite.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish-vpk

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package installer (Velopack)
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          vpk pack --packId Rewrite --packVersion 1.0.0 --packDir publish-vpk --mainExe Rewrite.exe -o Releases

      - uses: actions/upload-artifact@v4
        with:
          name: Rewrite-Setup
          path: Releases
